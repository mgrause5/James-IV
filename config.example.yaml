# James IV -- Michael's hunting list.
# `james init` copies this to config.yaml; edit that copy on the server.
#
# THE FULL LIST (kept here so nothing is forgotten -- add/remove freely):
#   On Resy, hunted below:  Carbone, Torrisi, 4 Charles, Tatiana, Cote,
#                           Raoul's, I Sodi, Via Carota, Minetta Tavern,
#                           Balthazar, Borgo, Lucali
#   Not found on Resy (searched Aug 2026 under every name variant):
#     - The Eighty Six .. no Resy NYC listing; if you have its Resy page URL,
#                         the slug in that URL is all that's needed to add it
#
# Every venue id, slug, and drop time below was verified against the live
# Resy API on 2026-08-25. Drop targets use `auto: true`, so the bot re-reads
# each venue's stated policy daily and corrects itself if a venue changes.
#
# DEFAULTS CHOSEN (adjust to taste):
#   party of 2 · any night · 17:30-21:30, preferring 19:00-20:30
#   The five hardest rooms auto-BOOK; the rest NOTIFY your phone.
#   dry_run is ON: nothing books until you flip it to false.

settings:
  dry_run: true            # flip to false after a few days of good picks
  max_bookings_per_run: 2  # global ceiling per process run, across all targets
  request_rate: 4.0
  request_burst: 8
  state_path: state/james.db
  log_level: INFO
  reauth_interval_hours: 12
  notify_on_miss: false

targets:
  # ------------------------------------------------------------- auto-book
  - name: Carbone
    slug: carbone
    venue_id: 6194
    party_size: 2
    action: book
    days_ahead_min: 25
    days_ahead_max: 31
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
      - { start: "18:00", end: "19:00" }
    drop:
      auto: true
      at: "10:00:00"    # verified: "up to 30 days in advance ... 10:00 AM"
      days_ahead: 30
    max_bookings: 1
    priority: 10

  - name: Torrisi
    slug: torrisi
    venue_id: 64593
    party_size: 2
    action: book
    days_ahead_min: 25
    days_ahead_max: 31
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
      - { start: "18:00", end: "19:00" }
    drop:
      auto: true
      at: "10:00:00"    # verified: "up to 30 days in advance, starting at 10:00 AM EST"
      days_ahead: 30
    max_bookings: 1
    priority: 10

  - name: 4 Charles Prime Rib
    slug: 4-charles-prime-rib
    venue_id: 834
    party_size: 2
    action: book
    days_ahead_min: 18
    days_ahead_max: 22
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
    drop:
      auto: true
      at: "09:00:00"    # verified: "up to 21 days in advance" at 9:00 AM
      days_ahead: 21    # NOTE: 21 days and 9am -- different from the others
    max_bookings: 1
    priority: 9

  - name: Tatiana
    slug: tatiana
    venue_id: 65452
    party_size: 2
    action: book
    days_ahead_min: 24
    days_ahead_max: 29
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
    drop:
      auto: true
      at: "12:00:00"    # verified: "28 days in advance at 12:00pm EST" -- NOON
      days_ahead: 28
    max_bookings: 1
    priority: 9

  - name: Cote
    slug: cote-nyc
    venue_id: 72271
    party_size: 2
    action: book
    days_ahead_min: 25
    days_ahead_max: 31
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
    drop:
      auto: true
      at: "10:00:00"    # verified: parties up to 6 open 30 days ahead, 10:00 AM
      days_ahead: 30
    max_bookings: 1
    priority: 8

  - name: Raoul's
    slug: raoulsrestaurant
    venue_id: 7241
    party_size: 2
    action: book
    days_ahead_min: 25
    days_ahead_max: 31
    earliest: "17:30"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }
    drop:
      auto: true
      # Page verified: "up to 30 days in advance, exclusively through Resy" --
      # but it does not state a release TIME. 10:00 is the common NYC pattern;
      # `auto` corrects this the moment their page states one. Watch the first
      # drop's log to confirm.
      at: "10:00:00"
      days_ahead: 30
    max_bookings: 1
    priority: 8

  # ---------------------------------------------------- notify-only, polled
  # These watch for cancellations across the next month and buzz your phone
  # with a deep link. Change `action: notify` to `book` on any you want the
  # bot to grab on its own.
  - name: I Sodi
    slug: i-sodi
    venue_id: 443
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:30"
    latest: "21:30"
    poll_interval_seconds: 60
    priority: 5
    notes: "No stated release policy; cancellation hunting only."

  - name: Via Carota
    slug: via-carota
    venue_id: 2567
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:30"
    latest: "21:30"
    poll_interval_seconds: 60
    priority: 4
    notes: "Mostly walk-in; a limited number of reservations, 30 days out at 10am.
      Add a drop block if you want those sniped."

  - name: Minetta Tavern
    slug: minetta-tavern
    venue_id: 9846
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:30"
    latest: "21:30"
    poll_interval_seconds: 60
    priority: 4
    notes: "No stated release policy; cancellation hunting only."

  - name: Balthazar
    slug: balthazar-nyc
    venue_id: 50227
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:30"
    latest: "21:30"
    poll_interval_seconds: 90
    priority: 3
    notes: "No stated release policy; big room, tables usually findable."

  - name: Lucali
    slug: lucali-ny
    venue_id: 54876
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:00"
    latest: "21:30"
    poll_interval_seconds: 90
    priority: 3
    notes: "Historically walk-in only; a Resy listing exists. If it never shows
      inventory, that is their policy, not a bot problem."

  - name: Borgo
    slug: borgo
    venue_id: 84290
    party_size: 2
    action: notify
    days_ahead_min: 0
    days_ahead_max: 30
    earliest: "17:30"
    latest: "21:30"
    poll_interval_seconds: 60
    priority: 4
    notes: "No stated release policy; cancellation hunting only."
