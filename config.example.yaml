# James IV -- target configuration.
# Copy to config.yaml and edit. Credentials live in .env, not here.

settings:
  # Find and rank, but never actually book. Start here for a day or two so you
  # can see what the bot would have done before you let it use your card.
  dry_run: true

  # Hard ceiling on bookings per process run, across all targets. Cheap
  # insurance against a config mistake booking you five dinners.
  max_bookings_per_run: 2

  # Requests per second against Resy, and burst allowance. The defaults are
  # deliberately polite. Raising them does not make you faster at a drop
  # (the burst path bypasses the bucket anyway) -- it just makes you noisier
  # the other 23 hours of the day, which is how accounts get flagged.
  request_rate: 4.0
  request_burst: 8

  state_path: state/james.db
  log_level: INFO
  reauth_interval_hours: 12

  # Alert even when we found a table and lost the race to book it. Useful while
  # tuning, noisy once you trust it.
  notify_on_miss: false

targets:
  # ---------------------------------------------------------------------
  # A drop-time snipe -- the pattern for rooms that sell out the instant
  # inventory is released.
  #
  # `drop.at` and `drop.days_ahead` are the two settings that decide whether
  # this works at all. They are on the venue's Resy page, in the booking
  # policy notes ("Reservations open 30 days in advance at 9AM"). Do not
  # guess them: run `james window torrisi` to see the current booking
  # horizon, and `james simulate Torrisi` to rehearse the whole thing.
  # ---------------------------------------------------------------------
  - name: Torrisi
    slug: torrisi
    party_size: 2
    action: book

    # Friday tables, 30 days out. The range is wider than days_ahead so the
    # poll engine also catches cancellations either side of the drop.
    days_ahead_min: 25
    days_ahead_max: 35
    weekdays: [fri]

    earliest: "18:00"
    latest: "21:30"
    preferred_windows:
      - { start: "19:00", end: "20:30" }   # first choice
      - { start: "18:00", end: "19:00" }   # will accept
      - { start: "20:30", end: "21:30" }   # will accept

    seating_types: ["Dining Room", "Bar"]  # ranked; empty means anything
    exclude_seating: ["Counter"]

    drop:
      enabled: true
      # Read the release time and day count off the venue's own Resy page at
      # startup, and re-check daily. The values below become fallbacks for
      # anything the page does not state. `james policy torrisi` shows exactly
      # what would be discovered; `james doctor` cross-checks it against this
      # file either way.
      auto: true
      at: "10:00:00"     # fallback (verified vs the live venue page, Aug 2026:
                         # "up to 30 days in advance, starting at 10:00 AM EST")
      days_ahead: 30     # fallback: releases the date exactly this far out
      lead_ms: 250       # fire slightly early to absorb network latency
      # The snipe is a handful of precisely timed shots, not a barrage: one
      # worker, one request every 400ms, five requests total. Clock sync wins
      # the race; volume only gets accounts flagged. If all five miss, the
      # poll loop sweeps the same date again within a minute.
      burst_concurrency: 1
      burst_interval_ms: 400
      max_requests: 5
      burst_seconds: 10  # outer time limit; the request cap ends it far sooner

    poll_interval_seconds: 60
    max_bookings: 1
    priority: 10

  # ---------------------------------------------------------------------
  # A cancellation hunter. No drop block -- it just watches a date range
  # patiently and pounces when somebody cancels. This is where most tables
  # actually come from.
  # ---------------------------------------------------------------------
  - name: 4 Charles Prime Rib
    slug: 4-charles-prime-rib
    party_size: 2
    party_size_fallback: [3]
    action: book

    days_ahead_min: 0
    days_ahead_max: 30
    weekdays: [wed, thu, fri, sat]

    earliest: "18:00"
    latest: "21:00"
    preferred_windows:
      - { start: "19:00", end: "20:30" }

    # Ignore anything starting sooner than this. Same-day cancellation hunting
    # otherwise surfaces tables you cannot physically get to -- and Resy will
    # happily return tonight's 7pm slot to a query you make at 8pm.
    min_lead_minutes: 120

    poll_interval_seconds: 45
    poll_jitter: 0.35
    max_bookings: 1
    priority: 5
    notes: "Notoriously hard. Cancellations trickle out all day."

  # ---------------------------------------------------------------------
  # Notify-only: a place you would like to know about but do not want the
  # bot committing your card to.
  # ---------------------------------------------------------------------
  - name: Semma
    slug: semma
    party_size: 2
    action: notify

    dates:
      - 2026-09-12
      - 2026-09-13

    earliest: "17:00"
    latest: "22:00"
    poll_interval_seconds: 90
    priority: 1
